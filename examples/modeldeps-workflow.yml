name: AI model lifecycle
on:
  pull_request:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  modeldeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Update this reviewed full commit pin when upgrading ModelDeps.
      - uses: valseeee/modeldeps@73387f41293850af7bff73c8b47561306e5c84af # 0.4.0 source
        with:
          path: .
          fail-in-days: "30"
          strict-stale: "true"
          format: text
