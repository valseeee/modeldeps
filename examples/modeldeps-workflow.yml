name: AI model lifecycle
on:
  pull_request:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  modeldeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Update this reviewed full commit pin when upgrading ModelDeps.
      - uses: valseeee/modeldeps@35e278f03fc9fd555a9808c1d3b5d024e65f7ad3 # 0.4.0 source, CI verified
        with:
          path: .
          fail-in-days: "30"
          strict-stale: "true"
          format: text
