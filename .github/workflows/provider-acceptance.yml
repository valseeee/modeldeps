name: Read-only provider acceptance
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-source:
    strategy:
      fail-fast: false
      matrix:
        provider: [anthropic, google]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Fetch official source into a separate candidate
        shell: bash
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          mkdir -p reports/provider-live
          node dist/cli.js registry sync --provider "$PROVIDER" --live --registry data/registry.json --output reports/provider-live/candidate.json > reports/provider-live/fetch.log 2>&1
      - name: Validate candidate registry
        run: node dist/cli.js registry validate --registry reports/provider-live/candidate.json
      - name: Ensure bundled registry remains unchanged
        if: always()
        run: git diff --exit-code -- data/registry.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: provider-live-${{ matrix.provider }}
          path: reports/provider-live/
