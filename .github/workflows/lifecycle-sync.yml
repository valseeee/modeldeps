name: Refresh model lifecycle evidence
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lifecycle-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sync Anthropic official lifecycle page
        run: node dist/cli.js registry sync --provider anthropic --live --registry data/registry.json --output data/registry.json
      - name: Sync Gemini official lifecycle page
        run: node dist/cli.js registry sync --provider google --live --registry data/registry.json --output data/registry.json
      - name: Sync OpenAI API lifecycle data when a key is configured
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            node dist/cli.js registry sync --provider openai --registry data/registry.json --output data/registry.json
          else
            echo "OPENAI_API_KEY secret not configured; skipping authenticated OpenAI API sync."
          fi
      - name: Validate updated registry and run tests
        run: |
          node dist/cli.js registry validate --registry data/registry.json
          npm test
          npm run benchmark
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-lifecycle-candidate
          path: data/registry.json
  propose:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-lifecycle-candidate
          path: data
      - name: Create lifecycle update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/model-lifecycle-refresh
          commit-message: "chore: refresh model lifecycle evidence"
          title: "chore: refresh model lifecycle evidence"
          body: "Automated fetch; human review of official URLs, dates, hashes and replacements required. Never auto-merge."
