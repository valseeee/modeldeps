name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install, build, test, demos and package smoke
        run: npm run verify:delivery
      - name: Ensure committed CLI bundle matches source
        run: git diff --exit-code -- dist
      - name: Real repository harness smoke (no clones)
        run: node scripts/benchmark-real-repos.mjs --max-repos 1 --output smoke.json
      - name: Retain executed commands and verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            reports/verification/final-*.json
            reports/verification/final-*.log
            smoke.json

  action-consumer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Healthy fixture through the composite action
        uses: ./
        with:
          path: demo/repository/healthy
          registry-path: demo/registry.fixture.json
          strict-unknown: 'true'
          format: json
      - name: Retired fixture through the composite action
        id: retired
        continue-on-error: true
        uses: ./
        with:
          path: demo/repository/retired
          registry-path: demo/registry.fixture.json
      - name: Ensure the action blocks a retired model
        if: steps.retired.outcome != 'failure'
        shell: bash
        run: exit 1
      - name: Consume the uploaded action through its reviewed GitHub commit
        uses: valseeee/modeldeps@81e914b94c64b86d755a05eb4658547ee37fead9 # 0.4.0 source
        with:
          path: demo/repository/healthy
          registry-path: demo/registry.fixture.json
          strict-unknown: 'true'
